<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriFit Planner</title>
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Estilos para cuando se imprima o exporte a PDF */
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .print-shadow-none { box-shadow: none !important; border: 1px solid #e5e7eb; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <!-- Barra de navegación superior -->
    <nav class="bg-emerald-600 text-white p-4 shadow-md no-print">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fa-solid fa-leaf mr-2"></i> NutriFit Planner</h1>
            <button onclick="window.print()" class="bg-white text-emerald-600 px-4 py-2 rounded font-bold hover:bg-gray-100 transition">
                <i class="fa-solid fa-print"></i> Imprimir Plan
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- COLUMNA 1: FORMULARIO DE PERFIL DEL PACIENTE -->
        <section class="bg-white p-6 rounded-lg shadow-md lg:col-span-1 print-shadow-none">
            <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2"><i class="fa-solid fa-user"></i> Datos del Paciente</h2>
            
            <form id="nutritionForm" class="space-y-4 no-print">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Edad (años)</label>
                        <input type="number" id="edad" required class="w-full border p-2 rounded mt-1" min="15" max="100">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Sexo</label>
                        <select id="sexo" class="w-full border p-2 rounded mt-1">
                            <option value="M">Hombre</option>
                            <option value="F">Mujer</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Peso (kg)</label>
                        <input type="number" step="0.1" id="peso" required class="w-full border p-2 rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Estatura (cm)</label>
                        <input type="number" id="estatura" required class="w-full border p-2 rounded mt-1">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium">Nivel de Actividad</label>
                    <select id="actividad" class="w-full border p-2 rounded mt-1">
                        <option value="1.2">Sedentario (Poco o nulo ejercicio)</option>
                        <option value="1.375">Ligero (Ejercicio 1-3 días/sem)</option>
                        <option value="1.55">Moderado (Ejercicio 3-5 días/sem)</option>
                        <option value="1.725">Muy Activo (Ejercicio 6-7 días/sem)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium">Objetivo Físico</label>
                    <select id="objetivo" class="w-full border p-2 rounded mt-1">
                        <option value="bajar">Bajar de Peso (Déficit)</option>
                        <option value="tonificar">Tonificar / Recomposición</option>
                        <option value="definir">Definir (Déficit agresivo)</option>
                        <option value="masa">Ganar Masa Muscular (Superávit)</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded hover:bg-emerald-700 transition">
                    Generar Menú
                </button>
            </form>

            <!-- Resumen del paciente que solo se ve al imprimir -->
            <div id="printProfile" class="hidden print:block text-sm mt-4 space-y-2">
                <p><strong>Paciente:</strong> <span id="lblEdad"></span> años, <span id="lblSexo"></span></p>
                <p><strong>Antropometría:</strong> <span id="lblPeso"></span> kg, <span id="lblEstatura"></span> cm</p>
                <p><strong>Objetivo:</strong> <span id="lblObjetivo" class="uppercase font-bold"></span></p>
            </div>
        </section>

        <!-- COLUMNA 2 y 3: RESULTADOS DE CALORÍAS Y PORCIONES -->
        <section class="lg:col-span-2 space-y-6 hidden" id="resultsContainer">
            
            <!-- Requerimiento Calorico y Macros -->
            <div class="bg-white p-6 rounded-lg shadow-md print-shadow-none">
                <h2 class="text-xl font-bold text-gray-700 mb-4"><i class="fa-solid fa-fire"></i> Requerimiento Diario</h2>
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <p class="text-sm text-gray-500">Calorías Totales (Ajustadas)</p>
                        <p class="text-3xl font-bold text-emerald-600" id="resCalorias">0 kcal</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div class="bg-red-50 p-3 rounded border border-red-100">
                        <p class="text-xs font-bold text-red-600 uppercase">Proteínas</p>
                        <p class="text-lg font-bold" id="resProtes">0g</p>
                    </div>
                    <div class="bg-blue-50 p-3 rounded border border-blue-100">
                        <p class="text-xs font-bold text-blue-600 uppercase">Carbohidratos</p>
                        <p class="text-lg font-bold" id="resCarbos">0g</p>
                    </div>
                    <div class="bg-yellow-50 p-3 rounded border border-yellow-100">
                        <p class="text-xs font-bold text-yellow-600 uppercase">Grasas</p>
                        <p class="text-lg font-bold" id="resGrasas">0g</p>
                    </div>
                </div>
            </div>

            <!-- Porciones calculadas -->
            <div class="bg-white p-6 rounded-lg shadow-md print-shadow-none">
                <h2 class="text-xl font-bold text-gray-700 mb-4"><i class="fa-solid fa-apple-whole"></i> Tus Porciones Diarias</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="porcionesGrid">
                    <!-- Dinámico desde script.js -->
                </div>
            </div>

            <!-- Planeador de comidas -->
            <div class="bg-white p-6 rounded-lg shadow-md print-shadow-none mt-6">
                <h2 class="text-xl font-bold text-gray-700 mb-4"><i class="fa-solid fa-utensils"></i> Tiempos de Comida</h2>
                <div class="space-y-4">
                    <div class="border p-4 rounded bg-gray-50">
                        <h3 class="font-bold text-lg text-emerald-700 mb-2">Desayuno</h3>
                        <textarea class="w-full border rounded p-2 text-sm" rows="2" placeholder="Escribe aquí tu menú..."></textarea>
                    </div>
                    <div class="border p-4 rounded bg-gray-50">
                        <h3 class="font-bold text-lg text-emerald-700 mb-2">Comida</h3>
                        <textarea class="w-full border rounded p-2 text-sm" rows="2" placeholder="Escribe aquí tu menú..."></textarea>
                    </div>
                    <div class="border p-4 rounded bg-gray-50">
                        <h3 class="font-bold text-lg text-emerald-700 mb-2">Cena</h3>
                        <textarea class="w-full border rounded p-2 text-sm" rows="2" placeholder="Escribe aquí tu menú..."></textarea>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- Conexión a tu archivo JavaScript en la carpeta js/ -->
    <script src="js/script.js"></script>
</body>
</html>
