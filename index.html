<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NutriFit Planner - Clínica AI</title>
  
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    [x-cloak] { display: none !important; }

    @media print {
      body * { visibility: hidden; }
      #plan-impresion, #plan-impresion * { visibility: visible; }
      #plan-impresion {
        position: absolute; left: 0; top: 0; width: 100%;
        font-family: sans-serif; color: black; padding: 20px;
      }
      .no-print { display: none !important; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <script src="./js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@2.8.2/dist/alpine.min.js" defer></script>
</head>
<body :class="darkMode ? 'bg-gray-900 text-gray-100' : 'bg-gray-100 text-gray-800'" class="min-h-screen antialiased transition-colors duration-200" x-data="initNutriApp()" x-init="initDatabase()">

  <div x-show="cargandoAuth" class="min-h-screen flex items-center justify-center font-bold text-gray-500 text-sm">
    Cargando sistema de Nutrición...
  </div>

  <div x-show="!cargandoAuth && !user" x-cloak class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-600 to-teal-800 p-4">
    <div class="bg-white text-gray-800 p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-md">
      <div class="text-center mb-6">
        <span class="text-5xl">🥗</span>
        <h1 class="text-2xl font-black mt-2">NutriFit Planner</h1>
        <p class="text-xs text-gray-500" x-text="modoRegistro ? 'Crea tu cuenta' : 'Ingresa a tu portal nutricional'"></p>
      </div>

      <form @submit.prevent="procesarAuth()" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Correo Electrónico:</label>
          <input type="email" x-model="emailAuth" required placeholder="tu@correo.com" class="w-full p-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Contraseña:</label>
          <input type="password" x-model="passAuth" required placeholder="••••••••" class="w-full p-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <button type="submit" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl shadow-lg hover:bg-emerald-700 transition" x-text="modoRegistro ? 'Crear Cuenta' : 'Iniciar Sesión'"></button>
      </form>

      <div class="mt-6 text-center border-t pt-4">
        <button @click="modoRegistro = !modoRegistro" class="text-xs font-bold text-emerald-600 hover:underline">
          <span x-text="modoRegistro ? '¿Ya tienes cuenta? Inicia Sesión' : '¿No tienes cuenta? Regístrate aquí'"></span>
        </button>
      </div>
      <div class="mt-6 border-t pt-3 text-[10px] text-gray-400 text-center leading-tight">
        ⚠️ <strong>Aviso legal:</strong> Herramienta de orientación algorítmica y de IA. No sustituye la consulta médica presencial.
      </div>
    </div>
  </div>

  <div x-show="!cargandoAuth && user" x-cloak class="min-h-screen flex flex-col md:flex-row pb-16 md:pb-0">
    
    <div :class="darkMode ? 'bg-gray-800 border-r border-gray-700' : 'bg-emerald-600'" class="md:w-20 flex md:flex-col items-center justify-between p-3 md:py-6 flex-shrink-0 shadow-md transition-colors duration-200">
      <div class="flex md:flex-col items-center gap-2 md:gap-4 w-full justify-between md:justify-start">
        <a href="#" class="h-10 w-10 bg-emerald-50 text-emerald-700 rounded-full flex items-center justify-center font-bold text-lg shadow">🍃</a>
        <div class="flex md:flex-col gap-2">
          <button @click="pestanaActiva = 'plan'" :class="pestanaActiva === 'plan' ? 'bg-emerald-900 text-white ring-2 ring-white' : 'bg-emerald-700 text-white hover:bg-emerald-800'" class="h-10 w-10 rounded-xl flex items-center justify-center shadow transition" title="Prescripción Dietética">📋</button>
          <button @click="pestanaActiva = 'progreso'" :class="pestanaActiva === 'progreso' ? 'bg-emerald-900 text-white ring-2 ring-white' : 'bg-emerald-700 text-white hover:bg-emerald-800'" class="h-10 w-10 rounded-xl flex items-center justify-center shadow transition" title="Evolución Antropométrica">📈</button>
          <button @click="toggleDarkMode()" class="h-10 w-10 rounded-xl bg-yellow-400 text-gray-900 flex items-center justify-center shadow hover:bg-yellow-500 transition">
            <span x-text="darkMode ? '☀️' : '🌙'"></span>
          </button>
        </div>
      </div>
      <button @click="cerrarSesion()" class="h-10 w-10 rounded-xl bg-red-500 text-white flex items-center justify-center shadow hover:bg-red-600 transition">🚪</button>
    </div>

    <div x-show="pestanaActiva === 'plan'" class="flex-grow p-4 md:p-6 overflow-x-hidden w-full max-w-6xl mx-auto space-y-6">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h1 class="text-2xl font-black">Prescripción Clínica Inteligente</h1>
          <p class="text-xs text-gray-400" x-text="'Usuario: ' + (user ? user.email : '')"></p>
        </div>
        <button @click="imprimirPlan()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-700 transition shadow">
          🖨️ Imprimir Hoja Clínica
        </button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div :class="darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'" class="p-5 rounded-2xl border shadow-sm h-fit">
          <h2 class="text-base font-bold mb-3 border-b pb-2 flex items-center gap-2">👤 Antropometría Básica</h2>

          <form @submit.prevent="calcularPlan()" class="space-y-3 text-xs">
            <div>
              <label class="block font-bold mb-1">Paciente / Usuario</label>
              <input type="text" x-model="perfil.nombre" required placeholder="Ej. Marco Antonio" class="w-full p-2 border rounded-lg" :class="darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50'">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-bold mb-1">Edad (años)</label>
                <input type="number" x-model="perfil.edad" required class="w-full p-2 border rounded-lg" :class="darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50'">
              </div>
              <div>
                <label class="block font-bold mb-1">Sexo Biológico</label>
                <select x-model="perfil.sexo" class="w-full p-2 border rounded-lg" :class="darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50'">
                  <option value="M">Hombre</option>
                  <option value="F">Mujer</option>
                </select>
              </div>
              <div>
                <label class="block font-bold mb-1">Peso (kg)</label>
                <input type="number" step="0.1" x-model="perfil.peso" required class="w-full p-2 border rounded-lg" :class="darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50'">
              </div>
              <div>
                <label class="block font-bold mb-1">Estatura (cm)</label>
                <input type="number" x-model="perfil.estatura" required class="w-full p-2 border rounded-lg" :class="darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50'">
              </div>
            </div>

            <div>
              <label class="block font-bold mb-1">Actividad Física (PAL)</label>
              <select x-model="perfil.actividad" class="w-full p-2 border rounded-lg" :class="darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50'">
                <option value="1.2">Sedentario (1.2 - Poco/Sin ejercicio)</option>
                <option value="1.375">Ligero (1.375 - 1 a 3 días/sem)</option>
                <option value="1.55">Moderado (1.55 - 3 a 5 días/sem)</option>
                <option value="1.725">Muy Activo (1.725 - 6 a 7 días/sem)</option>
              </select>
            </div>

            <div>
              <label class="block font-bold mb-1">Objetivo Nutricional</label>
              <select x-model="perfil.objetivo" class="w-full p-2 border rounded-lg" :class="darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50'">
                <option value="bajar">Pérdida de Grasa (Déficit -500 kcal)</option>
                <option value="tonificar">Recomposición Corporal (Déficit -200 kcal)</option>
                <option value="definir">Definición Agresiva (Déficit -700 kcal)</option>
                <option value="masa">Hipertrofia Muscular (Superávit +400 kcal)</option>
              </select>
            </div>

            <div class="pt-2 border-t border-gray-700">
              <label class="block font-bold mb-1 text-amber-400">🏥 Padecimiento Especial:</label>
              <select x-model="perfil.padecimiento" class="w-full p-2 border rounded-lg font-bold" :class="darkMode ? 'bg-gray-700 border-amber-600 text-white' : 'bg-amber-50 text-gray-900'">
                <option value="ninguno">Sin padecimiento (Persona sana)</option>
                <option value="diabetes">Diabetes Mellitus (Control Glucémico)</option>
                <option value="hepatitis">Enfermedad Hepática (Restricción Lípidos)</option>
                <option value="renal">Enfermedad Renal (Restricción Proteica)</option>
                <option value="hipertension">Hipertensión Arterial (Bajo en Sodio)</option>
              </select>
            </div>

            <div class="pt-2 border-t border-gray-700 mt-2">
              <button type="button" @click="mostrarAvanzado = !mostrarAvanzado" class="w-full text-left font-bold text-blue-400 flex justify-between items-center bg-blue-900/20 p-2 rounded-lg border border-blue-800/50 hover:bg-blue-900/40 transition">
                <span>🔬 Datos Clínicos / Bioimpedancia</span>
                <span x-text="mostrarAvanzado ? '▲' : '▼'"></span>
              </button>
              
              <div x-show="mostrarAvanzado" x-collapse class="mt-3 space-y-3 p-3 bg-gray-900/50 rounded-lg border border-gray-700">
                <p class="text-[10px] text-gray-400 leading-tight">Ingresa los datos para cálculos con Katch-McArdle a través de IA.</p>
                <div>
                  <label class="block font-bold mb-1 text-blue-30
